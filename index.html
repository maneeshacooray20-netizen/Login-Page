<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="loginpage.css">
</head>
<body>
  <h1 class="welcome">Welcome back!</h1>
  <div class="container">
    <div class="username">
      <h2 class="login">Login</h2>
     <label for="uname">Username</label><br>
     <input type="text" id="uname" name="uname" placeholder="Name, email or phone number">
    </div>

    <div class="password">
      <label for="pw">Password</label><br>
      <input type="text" id="pw" name="pw" placeholder="Include at least 8 characters">
    </div>

    <div class="signin">
      <button class="signinbtn">Sign in</button>
    </div>
  </div>
 
</body>
</html>
